name: Glow
description: 'Glow (glow.fm) was a podcast subscription and membership monetization
  platform that let podcasters run paid, listener-supported premium feeds. The standalone
  product has since been folded into Libsyn: as of this enrichment pass the glow.fm
  domain issues a 301 redirect to Libsyn''s podcast-monetization offering, its TLS
  certificate has expired, and no active developer portal, API, documentation, or
  SDK surface remains under the Glow brand. It was surfaced in the API Evangelist
  network as a venture-portfolio lead (a16z, Norwest Venture Partners, Union Square
  Ventures) and has no live API to enrich.'
